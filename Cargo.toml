[package]
name = "corpse-launcher"
version = "2.0.0"
edition = "2021"

[dependencies]
sdl2 = { version = "0.37", features = ["ttf", "image", "unsafe_textures"] }
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
crc32fast = "1.4"
md5 = "0.7"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
