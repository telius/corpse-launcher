name: Build and Release AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev python3-pip python3-setuptools patchelf desktop-file-utils file wget

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          mkdir -p assets
          pyinstaller --clean --noconfirm \
            --add-data "assets:assets" \
            --add-data "ui:ui" \
            --add-data "data:data" \
            --add-data "importer:importer" \
            --add-data "controller:controller" \
            --add-data "config.example.toml:." \
            --add-data "launcher.py:." \
            --add-data "config.py:." \
            --hidden-import yaml \
            --hidden-import vdf \
            --hidden-import requests \
            --hidden-import pygame \
            corpse-launcher.py

      - name: Create AppDir Layout
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy executable and assets
          cp -r dist/corpse-launcher/* AppDir/usr/bin/
          
          # Desktop entry
          cp corpse-launcher.desktop AppDir/usr/share/applications/
          cp AppDir/usr/share/applications/corpse-launcher.desktop AppDir/
          
          # AppRun script (simple bash wrapper to invoke python binary)
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(dirname "$(readlink -f "$0")")
          exec "$SELF/usr/bin/corpse-launcher" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Icon
          cp corpse-launcher.png AppDir/usr/share/icons/hicolor/256x256/apps/corpse-launcher.png
          cp corpse-launcher.png AppDir/corpse-launcher.png

      - name: Download AppImageTool
        run: |
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Package AppImage (FUSE-less mode)
        run: |
          # Run appimagetool by extracting it, bypassing FUSE mount blocks
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir corpse-launcher-x86_64.AppImage

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: corpse-launcher-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
