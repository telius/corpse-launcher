name: Build and Release AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsqlite3-dev pkg-config patchelf desktop-file-utils file wget

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release

      - name: Create AppDir Layout
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy executable
          cp target/release/corpse-launcher AppDir/usr/bin/corpse-launcher
          chmod +x AppDir/usr/bin/corpse-launcher

          # Desktop entry
          cp corpse-launcher.desktop AppDir/usr/share/applications/
          cp corpse-launcher.desktop AppDir/

          # AppRun script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(dirname "$(readlink -f "$0")")
          exec "$SELF/usr/bin/corpse-launcher" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Icon
          cp corpse-launcher.png AppDir/usr/share/icons/hicolor/256x256/apps/corpse-launcher.png
          cp corpse-launcher.png AppDir/corpse-launcher.png

      - name: Download AppImageTool
        run: |
          wget -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Package AppImage (FUSE-less mode)
        run: |
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir corpse-launcher-x86_64.AppImage

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            corpse-launcher-x86_64.AppImage
            target/release/corpse-launcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
